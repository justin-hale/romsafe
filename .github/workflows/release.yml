name: Release

# Pushing a tag like v0.1.0 publishes that release: the server image on GHCR, the signed APK, the
# Windows installer, the macOS disk images and the Linux AppImage on GitHub Releases. The tag must match the root package.json version,
# which is the one version for the server and both apps.
#
# Run it by hand from the Actions tab ("Run workflow") for a dry run: everything is built,
# including the signed APK and the desktop packages as workflow artifacts, but nothing is pushed
# or released.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/justin-hale/romsafe

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_TYPE" = tag ] && [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  server-tests:
    needs: version
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test

  client-tests:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :shared:allTests :desktop:test

  docker:
    needs: [version, server-tests, client-tests]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref_type == 'tag'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Tags
        id: tags
        run: |
          v=${{ needs.version.outputs.version }}
          # 0.1.0, 0.1 and latest; a prerelease (0.2.0-rc.1) gets only its own tag.
          if [[ "$v" == *-* ]]; then
            echo "tags=$IMAGE:$v" >> "$GITHUB_OUTPUT"
          else
            echo "tags=$IMAGE:$v,$IMAGE:${v%.*},$IMAGE:latest" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref_type == 'tag' }}
          tags: ${{ steps.tags.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ needs.version.outputs.version }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.licenses=AGPL-3.0-only
            org.opencontainers.image.title=RomSafe
            org.opencontainers.image.description=Self-hosted ROM library and emulator save sync server
          cache-from: type=gha
          cache-to: type=gha,mode=max

  android:
    needs: [version, server-tests, client-tests]
    runs-on: ubuntu-latest
    outputs:
      cert: ${{ steps.verify.outputs.cert }}
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
        with:
          # The versionCode is the commit count, so it needs the whole history.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - name: Build the signed APK
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ROMSAFE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ROMSAFE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ROMSAFE_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::The ANDROID_KEYSTORE_BASE64 secret isn't set"
            exit 1
          fi
          export ROMSAFE_KEYSTORE_FILE="$RUNNER_TEMP/release.jks"
          echo "$KEYSTORE_BASE64" | base64 -d > "$ROMSAFE_KEYSTORE_FILE"
          ./gradlew :android:assembleRelease
          rm -f "$ROMSAFE_KEYSTORE_FILE"
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp android/build/outputs/apk/release/android-release.apk "$GITHUB_WORKSPACE/dist/romsafe-${{ needs.version.outputs.version }}.apk"
      # Fails on an unsigned or broken APK; the fingerprint is the one to publish for verifying installs.
      - name: Verify the signature
        id: verify
        run: |
          apksigner=$(ls -d "$ANDROID_HOME"/build-tools/*/apksigner | sort -V | tail -1)
          cert=$("$apksigner" verify --print-certs "$GITHUB_WORKSPACE"/dist/*.apk | tee /dev/stderr | sed -n 's/.*certificate SHA-256 digest: //p' | head -1)
          [ -n "$cert" ] || { echo "::error::The APK isn't signed"; exit 1; }
          echo "cert=$cert" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: dist/*.apk
          if-no-files-found: error

  windows:
    needs: [version, server-tests, client-tests]
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
        with:
          # The MSI version's last number is the commit count.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktop:packageMsi
      - run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp desktop/build/compose/binaries/main/msi/*.msi "$GITHUB_WORKSPACE/dist/RomSafe-${{ needs.version.outputs.version }}.msi"
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/*.msi
          if-no-files-found: error

  # jpackage bundles a runtime for the machine it runs on, so each Mac architecture builds on its
  # own runner. The DMGs aren't notarized (no Apple Developer ID yet): docs/install.md explains
  # "Open Anyway".
  macos:
    needs: [version, server-tests, client-tests]
    strategy:
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
        with:
          # The bundle version's last number is the commit count.
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktop:packageDmg
      - run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          cp desktop/build/compose/binaries/main/dmg/*.dmg "$GITHUB_WORKSPACE/dist/RomSafe-${{ needs.version.outputs.version }}-macos-${{ matrix.arch }}.dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: dmg-${{ matrix.arch }}
          path: dist/*.dmg
          if-no-files-found: error

  linux:
    needs: [version, server-tests, client-tests]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: clients
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew :desktop:packageAppImage
      - run: desktop/packaging/linux/build-appimage.sh "${{ needs.version.outputs.version }}" "$GITHUB_WORKSPACE/dist"
      - uses: actions/upload-artifact@v4
        with:
          name: appimage
          path: dist/*.AppImage
          if-no-files-found: error

  release:
    needs: [version, docker, android, windows, macos, linux]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      # By name: the Docker build also stores a build-record artifact that isn't a release file.
      - uses: actions/download-artifact@v4
        with:
          name: apk
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: dist
      - uses: actions/download-artifact@v4
        with:
          pattern: dmg-*
          merge-multiple: true
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: appimage
          path: dist
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.version.outputs.version }}
          CERT: ${{ needs.android.outputs.cert }}
        run: |
          prerelease=""
          [[ "$VERSION" == *-* ]] && prerelease="--prerelease"
          cat > notes.md <<EOF
          ## Install

          - **Server**: \`docker pull $IMAGE:$VERSION\` (or \`:latest\`). See [docs/install.md](https://github.com/$GITHUB_REPOSITORY/blob/$GITHUB_REF_NAME/docs/install.md).
          - **Android**: \`romsafe-$VERSION.apk\` below, or add this repository to [Obtainium](https://github.com/ImranR98/Obtainium) for updates.
            Signing certificate SHA-256 (for Obtainium or [AppVerifier](https://github.com/soupslurpr/AppVerifier)): \`$CERT\`
          - **Windows**: \`RomSafe-$VERSION.msi\` below.
          - **macOS**: \`RomSafe-$VERSION-macos-arm64.dmg\` (Apple silicon) or \`-macos-x64.dmg\` (Intel). Not notarized yet: the first launch needs System Settings → Privacy & Security → **Open Anyway**.
          - **Linux and Steam Deck**: \`RomSafe-$VERSION-x86_64.AppImage\`. Make it executable and run it (on the Deck, from Desktop Mode).

          Update the server and the apps together: an app tells you when it and the server are too far apart.
          EOF
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "RomSafe $VERSION" \
            --notes-file notes.md \
            --generate-notes \
            $prerelease
